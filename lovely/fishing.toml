[[patches]]
[patches.pattern]
target = "states/Fishing.lua"
pattern = '''
self.pauseMenu:draw()
		local pp = self.pauseMenu.pausePosition
		if pp.w > 0 then
'''
position = "at"
payload = '''
		local pp = self.pauseMenu.pausePosition
		if pp.w <= 0 or not extrasavedata.fishingBookText then
			self.pauseMenu:draw()
		end
		if pp.w > 0 and self.bookPage ~= 0 then
if extrasavedata.fishingBookText then
	color()
	if self.fishPerPage <= 8 then
		love.graphics.draw(sprites.fishing.viewbook, 300, 180, 0, pp.w/220, 1, 325, 162)
		love.graphics.draw(sprites.fishing.viewbooktag, 300, 180, 0, pp.w/220, 1, 108, 162)
	else
		love.graphics.draw(sprites.fishing.viewbook2, 300, 180, 0, pp.w/440, 1, 217, 162)
		love.graphics.draw(sprites.fishing.viewbooktag, 300, 180, 0, pp.w/440, 1, 108, 162)
	end
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "states/Fishing.lua"
pattern = '''
	love.graphics.setScissor()
end
'''
position = "at"
payload = '''
	love.graphics.setScissor()
elseif self.bookPage == 0 then
	if pp.w > 0 then
		color() --220, 440
		local hScale = pp.w / ((self.fishPerPage <= 8) and 220 or 440)
		
		local w,h  = project.res.x - 100, project.res.y - 100
		local mx, my = mouse.x * project.res.x - 50, mouse.y * project.res.y - 50
		local data = exstuff.fishBookData
		local n = #data
		local forcedSmall = n > 5
		local useGrid = forcedSmall or not extrasavedata.fishingBookText
		
		local cols = useGrid and math.ceil(math.sqrt(n)) or n
		local rows = math.ceil(n / cols)
		local cellW, cellH = w / cols, h / rows
		
		local function pointInBook(mx, my, cx, cy, bw, bh, s)
			local halfW, halfH = (bw * s) / 2, (bh * s) / 2
			return mx >= cx - halfW and mx <= cx + halfW
				and my >= cy - halfH and my <= cy + halfH
		end
		-- if the number of books exceeds 16 then controller support for those past 16 gone
		-- as if there will be more than like 5 books max
		for i, b in ipairs(data) do
			local bookSprKey = extrasavedata.fishingBookText and b.big or b.small
			if forcedSmall then bookSprKey = b.small end
			local bookSpr = sprites.fishing[bookSprKey] or self.spr[bookSprKey]
			local bw, bh = bookSpr:getDimensions()
			local ox, oy = bw/2, bh/2
			
			local col = (i - 1) % cols
			local row = math.floor((i - 1) / cols)
			local cx = (col + 0.5) * cellW
			local cy = (row + 0.5) * cellH
			
			local s = math.min(1, cellW / bw, cellH / bh)
			local mhover = pointInBook(mx, my, cx, cy, bw, bh, s) and my < 215
			if mhover or self.bookMenu.selection == i then
				s = s * 1.1
				if (mouse.pressed == -1 and mhover) or maininput:pressed("accept") then
					self:closeBook(true)
					self:startShowCatch(b.vo, false, true)
				end
			end
			
			love.graphics.draw(bookSpr, cx + 50, cy + 50, 0, s * hScale, s, ox, oy)
		end
		
		if extrasavedata.fishingBookText then
			love.graphics.draw(sprites.fishing.viewbooktag,300, 180,0,hScale, 1,108, 162)
		end
		love.graphics.setScissor(pp.x1-pp.w*0.5,pp.y,pp.w,pp.h)
		self.bookMenu:draw()
		love.graphics.setScissor()
		--print(mx, my)
	end--[[
	if imgui.Button('addBook') then
		table.insert(exstuff.fishBookData, {
			mod = 'ExtraStuff',
			vo = 'book',
			small = 'book'
		})
	end]]
end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "states/Fishing.lua"
pattern = '''
self.bookMenu:addNumber('fish_bookPage',self,'bookPage',0,nil,{1,self.bookTotalPages},nil,self.bookTotalPages)
'''
position = "at"
payload = '''
local bookCount = (exstuff and exstuff.fishBookData and #exstuff.fishBookData) or 0
local buttonCount = math.max(self.fishPerPage, bookCount)
for i = 1, buttonCount do
	self.bookMenu:addOption('',function() end, 100)
end
if extrasavedata.replayFish then
	self.bookMenu:addNumber('fish_bookPage',self,'bookPage',0,nil,{0,self.bookTotalPages},nil,self.bookTotalPages)
else
	self.bookMenu:addNumber('fish_bookPage',self,'bookPage',0,nil,{1,self.bookTotalPages},nil,self.bookTotalPages)
end
'''
match_indent = true

